# R:soul configuration. Every option can also be set with an environment variable
# RSOUL__<SECTION>__<OPTION> (e.g. RSOUL__READARR__API_KEY), which overrides this file.
[Readarr]
# Readarr or Chaptarr (Chaptarr's API is Readarr-compatible; see media_mode below)
api_key = YOUR_READARR_API_KEY
host_url = http://localhost:8787
# How finished downloads are handed over:
#   scan     = Readarr/Chaptarr scans the folder and decides from the files' tags and names
#              which book they are (the classic way). It can decide differently from R:soul:
#              file a book under another title of its series, or create a new record and leave
#              the wanted one wanted.
#   targeted = R:soul asks for a ManualImport of the exact wanted book and compatible edition.
#              It verifies every input against new files on the intended record using exact
#              source/output history or readable output hashes. Explicit returned edition
#              information must agree; absent editionId is supported.
#              Requires Chaptarr/Readarr manualimport, bookfile and suitable edition metadata.
#              When unsure, it leaves the import pending; it NEVER falls back to a scan.
# For Chaptarr audiobooks prefer targeted (RSOUL__READARR__IMPORT_METHOD=targeted).
# New installations default to targeted. Existing explicit scan settings are respected.
import_method = targeted
# Set to True to disable automatic import into Readarr (default: False)
disable_sync = False
# Seconds to wait for any single request to Readarr/Chaptarr before giving up (0 = no limit)
request_timeout = 60
# Seconds a run waits for an import to finish. Imports that take longer, or that can't be
# submitted because Readarr/Chaptarr is unreachable, are followed up on the next run.
import_poll_timeout = 600

[Slskd]
api_key = YOUR_SLSKD_API_KEY
host_url = http://localhost:5030
url_base = /
# Seconds to wait for any single request to slskd before giving up (0 = no limit)
request_timeout = 30
download_dir = /path/to/slskd/downloads
# Directory path as seen by Readarr (if running in Docker/mapped volumes)
# Defaults to download_dir if not set
readarr_download_dir = /mapped/path/to/slskd/downloads
delete_searches = True

[Stacks]
# Stacks + Anna's Archive backend configuration
# Requires a running Stacks instance: https://github.com/zelestcarlyone/stacks
api_key = YOUR_STACKS_API_KEY
host_url = http://localhost:7788
download_dir = /path/to/stacks/downloads
# Directory path as seen by Readarr (if running in Docker/mapped volumes)
# Defaults to download_dir if not set
readarr_download_dir = /mapped/path/to/stacks/downloads
# Timeouts in seconds
search_timeout = 30
download_timeout = 600
poll_interval = 5
# Minimum match score (0.0-1.0) for title/author matching against AA results
min_match_ratio = 0.5
# FlareSolverr configuration for bypassing DDoS-Guard protection
# Requires a running FlareSolverr instance: docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
flaresolverr_enabled = False
flaresolverr_url = http://localhost:8191/v1

[Backends]
# Comma-separated list of backends in priority order (first = preferred)
# Available backends: slskd, stacks
priority = slskd,stacks
# Enable/disable individual backends
slskd_enabled = True
stacks_enabled = False

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.7
# What to look for: ebook | audiobook | both
#   ebook     - ebooks only, one file per book (default, original behaviour)
#   audiobook - audiobooks only; the complete selected files for one book/format are downloaded
#   both      - Chaptarr only: each wanted book's mediaType decides ebook or audiobook
# With Chaptarr, ebook/audiobook mode also filters the wanted list to that media type.
media_mode = ebook
# Preferred ebook formats in priority order (first = most preferred)
preferred_formats = epub,azw3,mobi
# Preferred audiobook formats in priority order (used for audiobook / both modes)
audiobook_formats = m4b,mp3
# Skip audiobook folders smaller than this in total (filters out samples)
audiobook_min_size_mb = 10
# Skip audiobook folders whose average bitrate over the book's length (when Chaptarr gives one)
# is below this many kbit/s. This is a configurable size/runtime sanity check; catalog
# duration can differ from the actual performance. 0 = no bitrate check.
audiobook_min_bitrate_kbps = 8
# Set downloads aside for review when all their files together play for less than this many
# minutes: a song or a sample, not an audiobook. Short stories wanted as books of their own
# can be shorter than a novel; lower this if you collect very short ones. 0 = no check.
audiobook_min_duration_minutes = 15
# Set downloaded audiobooks aside for review when their total running time differs from the
# length Chaptarr gives for the book by more than this fraction (0.25 = 25%). Off by default:
# Chaptarr's length can belong to another edition or narrator. 0 = no running-time
# check and no extra runtime lookup.
audiobook_duration_tolerance = 0
# At most this many of the best-matching audiobook folders are tried, best first, until one
# can be listed in full (each try opens the folder on the peer's share)
audiobook_browse_limit = 5
# Optional recording preferences. Empty languages/narrators mean unrestricted.
# Languages: comma-separated codes or names. Narrators: pipe-separated full names.
audiobook_languages =
audiobook_narrators =
# allow | reject. These apply to evidence from the actual release/tags.
audiobook_abridged = allow
audiobook_booktrack = allow
audiobook_dramatized = allow
# allow | warn | reject for missing evidence on restricted fields after download.
audiobook_unknown_recording = warn
# Pre-filter thresholds to reject obviously wrong matches early
# Minimum length ratio (shorter/longer string) - rejects if strings differ too much in length
min_length_ratio = 0.4
# Minimum Jaccard token overlap ratio - rejects if too few words in common
min_jaccard_ratio = 0.25
# Minimum number of overlapping words required
min_word_overlap = 2
# Component-wise matching: match author and title segments separately
# Minimum Jaccard for title component (rejects if title words don't match)
min_title_jaccard = 0.3
# Minimum Jaccard for author component
min_author_jaccard = 0.5
ignored_users = User1,User2
book_prepend_author = True
# Search type: first_page, incrementing_page, all
search_type = incrementing_page
# Maximum eligible books attempted per run; exclusions do not consume this limit.
number_of_books_to_grab = 10
# Scan bounded pages and persist every unattempted candidate before advancing.
# first_page still scans only page 1; all/incrementing_page rotate through the list.
wanted_scan_pages = 5
wanted_backlog_limit = 500
# Explicit local exclusions (never change Chaptarr monitoring or delete records).
# Exact numeric IDs; exact normalized titles separated by |; API publication types.
excluded_book_ids =
excluded_titles =
excluded_publication_types =
remove_wanted_on_failure = False
# A book R:soul downloaded and Readarr/Chaptarr imported is not downloaded again for this
# many days, even if it shows up as wanted again (0 = no such guard). When that happens the
# cause is on the other side: the file was attached to another record, or the record is a
# duplicate. Books that are wanted for a better quality (they have files) are not held back.
redownload_after_days = 30
# A book that a complete search found nowhere is not searched for again for this many days
# (0 = search on every run). Keeps R:soul from asking the Soulseek network the same
# questions every few minutes.
not_found_retry_days = 1
title_blacklist = word1,word2
# Search source: missing, cutoff_unmet, all
search_source = missing
# Maximum fallback attempts when search returns zero results (default: 5)
max_search_fallbacks = 5
# Distinct surname/title queries, capped per book. 429 is deferred, never cached as not found.
search_query_budget = 6
search_min_interval = 1
# Maximum individual wait before a search submission; a longer Retry-After
# remains saved and defers that search. This is not a cumulative run-time budget.
search_rate_limit_max_wait = 60

[Download Settings]
# Give up on a download when no new data has arrived for this long (seconds) while it
# is transferring. Slow but steady downloads never trip this. 0 = disabled.
stall_timeout = 1800
# Give up on a download that has waited this long (seconds) in the peer's upload queue.
# Soulseek queues can be long; for audiobooks 3600-7200 is more forgiving. 0 = no limit.
queue_timeout = 3600
# Overall safety cap per download (seconds), including time spent queued. 0 = no cap.
max_download_time = 86400
# Grace for slskd's final rename before requiring every manifest path to be a regular
# file of the exact expected byte size. No unknown-size legacy completion is assumed.
completed_file_settle_time = 30
# How long one run monitors downloads (seconds). 0 = wait until every download finishes.
# With a value > 0, unfinished downloads keep running in slskd and the next run continues
# monitoring them while it also searches for new books, so a slow download holds up new
# searches for at most this long.
monitor_window = 0
# Most downloads running at once, counting ones handed over from earlier runs. 0 = no limit.
# Search and monitoring interleave; failures/completions can free slots within the run.
max_active_downloads = 0
download_filtering = True
use_extension_whitelist = False
extensions_whitelist = lrc,nfo,txt

[Postprocessing]
# Matching thresholds for metadata validation (0.0 - 1.0)
match_ratio_exact = 0.8
match_ratio_normalized = 0.85
match_ratio_word = 0.7
match_ratio_loose = 0.85
match_ratio_jaccard = 0.5
# Set to True to skip ebook and audiobook title identity metadata validation. Audio stream/manifest
# integrity and explicitly configured recording policies remain enforced.
skip_validation = False
# Audiobooks: before a finished download is handed to Readarr/Chaptarr, its audio tags (album,
# title) are compared with the wanted book. Only tags that name another book of the author,
# a collection or another position in the series count; missing tags, the series as album
# and anything unrecognised are let through.
#   reject = retain contradictory audio and its journal for review; do not import it
#            unavailable catalog/tag-comparison evidence stays validating and retries later
#   warn   = only write a warning to the log
#   off    = skip title-tag identity comparison (integrity and recording checks still run)
audiobook_tag_check = reject
# Legacy option retained for configuration compatibility. Import failures and unknown
# outcomes stay journaled for review and do not create a peer ban.
import_failure_retry_days = 7
# Delete folders in failed_imports and failed_downloads this many days after R:soul put them
# there (0 = keep them until you delete them). Folders that a saved task still refers to are
# never deleted. Missing/untrustworthy state pauses cleanup. Folders from older versions
# start their clock when this is first switched on.
failed_retention_days = 0

[General]
# True: search and report what would be downloaded, without downloading, importing or changing
# anything. The report is logged and written to dry_run_report.txt in the data folder. The
# same as starting R:soul with --dry-run. Set it back to False for normal operation.
dry_run = False
# Read-only version probes; unknown versions do not imply unsupported functionality.
log_api_versions = True

[Notifications]
# Optional webhook (Discord, Slack, Apprise, ...) for things that need you. Empty = off.
# Best-effort background delivery: bounded queue, no redirects/retries or response-body
# buffering. Queue acceptance is not delivery; queued notices may be dropped on shutdown.
webhook_url =
# Comma-separated: needs_review, partial, submission_unknown, persistence_error
events = needs_review,persistence_error

[Logging]
level = INFO
# https://docs.python.org/3/library/logging.html#logrecord-attributes
# Note: When colors are enabled (TTY), a custom formatter is used that ignores this format
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s:	%(message)s
# https://docs.python.org/3/library/time.html#time.strftime
datefmt = %Y-%m-%dT%H:%M:%S%z
